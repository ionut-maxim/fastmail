# release-please keeps a release PR open from the Conventional Commits on
# main. Merging it tags vX.Y.Z and publishes the GitHub release with the
# changelog. This is a library, so nothing is built or uploaded.
name: release

on:
  push:
    branches: [main]

# The repository's default GITHUB_TOKEN is read-only; this workflow needs to
# push the release branch, open the PR, tag and create the release.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
