# Format check, vet and race tests on every PR and push to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.4
        with:
          install_args: go
      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)" || { echo 'unformatted files:'; gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags=live ./...
          go test -race ./...
